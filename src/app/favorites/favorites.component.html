<ActionBar class="action-bar">
    <NavigationButton visibility="hidden"></NavigationButton>
    <GridLayout columns="50, *">
        <Label col="0" class="fas" text="Ⓜ️" (tap)="onDrawerButtonTap()"></Label>
        <Label col="1" class="action-bar-title" text="Favoritos" verticalAlignment="center"></Label>
    </GridLayout>
</ActionBar>

<ScrollView class="page__content">
    <StackLayout class="p-15">
        <Label class="platform-title text-center text-muted m-b-10" [text]="platformMessage" textWrap="true"></Label>

        <!-- Mensaje cuando la lista de Redux está vacía -->
        <StackLayout *ngIf="items.length === 0" class="nt-form p-20" verticalAlignment="center">
            <Label class="page__content-icon far fa-star text-center m-b-10" text="⭐" style="font-size: 40;"></Label>
            <Label text="No has agregado ningún hotel a favoritos." class="text-center text-muted" textWrap="true"></Label>
        </StackLayout>

        <!-- Lista de elementos consumidos reactivamente desde el Store de Redux -->
        <StackLayout *ngFor="let item of items" class="card p-15 m-b-10" style="background-color: #ffffff; border-radius: 8;">
            <GridLayout columns="*, auto, auto" class="align-items-center">
                <StackLayout col="0">
                    <Label [text]="item.nombre || item.name" class="h3 font-weight-bold"></Label>
                    <Label [text]="item.categoria || item.ciudad || 'Favorito'" class="body text-muted"></Label>
                </StackLayout>

                <!-- Botón de "Leer ahora" (Despacha la acción LEER_AHORA al Store) -->
                <Button col="1" text="📖 Leer ahora" (tap)="accionLeerAhora(item)" class="btn btn-primary m-r-5" style="font-size: 11;"></Button>
                
                <!-- Botón para remover de favoritos -->
                <Button col="2" text="🗑️" (tap)="quitarFavorito(item)" class="btn btn-outline text-danger" style="font-size: 11;"></Button>
            </GridLayout>
        </StackLayout>

        <Button *ngIf="items.length > 0" text="Ver Detalle" (tap)="onGoToDetail()" class="btn btn-outline m-t-15"></Button>
    </StackLayout>
</ScrollView>
