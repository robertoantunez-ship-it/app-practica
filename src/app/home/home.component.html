<ActionBar class="action-bar">
  <NavigationButton visibility="hidden"></NavigationButton>
  <GridLayout columns="50, *">
    <Label col="0" class="fas" text="Ⓜ️" (tap)="onDrawerButtonTap()"></Label>
    <Label col="1" class="action-bar-title" text="Inicio" verticalAlignment="center"></Label>
  </GridLayout>
</ActionBar>

<ScrollView class="page__content">
  <StackLayout class="p-15">
    
    <!-- 1. Sección interactiva de la Rana -->
    <StackLayout class="card p-20 m-b-20 text-center" style="background-color: #e8f5e9; border-radius: 10;">
      <Label text="¡Interactúa con la rana! 🐸" class="h2 font-weight-bold m-b-5" style="color: #1b5e20;"></Label>
      <Label text="Toca o mantén presionado" class="body m-b-15" style="color: #2e7d32;" textWrap="true"></Label>
      
      <Label text="🐸" style="font-size: 60;" (tap)="onAnimarRana($event)" (longPress)="onSuperSaltoRana($event)"></Label>
    </StackLayout>

    <!-- 2. Sección reactiva de Redux (Lecturas seleccionadas) -->
    <StackLayout class="m-t-10">
      <Label text="Opiniones de los huespedes" class="h2 font-weight-bold m-b-5" style="color: #212121;"></Label>
      <Label text="Lista actualizada" class="body m-b-15" style="color: #424242;" textWrap="true"></Label>

      <!-- Estado vacío -->
      <StackLayout *ngIf="listaLeerAhora.length === 0" class="p-20 text-center" style="background-color: #f8f9fa; border-radius: 8; border-width: 1; border-color: #e0e0e0;">
        <Label text="📖" style="font-size: 30;" class="m-b-5"></Label>
        <Label text="Aún no has presionado 'Leer ahora' en ningún favorito." style="color: #616161;" textWrap="true"></Label>
      </StackLayout>

      <!-- Lista enviada desde Redux -->
      <StackLayout *ngFor="let item of listaLeerAhora" class="card p-15 m-b-10" style="background-color: #ffffff; border-radius: 8; border-width: 1; border-color: #e0e0e0;">
        <!-- Título en azul marino oscuro (#0d47a1) en lugar de azul cielo -->
        <Label [text]="'📖 ' + (item.nombre || item.name)" class="h3 font-weight-bold m-b-5" style="color: #0d47a1;" textWrap="true"></Label>
        <!-- Descripción en gris carbón oscuro (#37474f) -->
        <Label [text]="item.descripcion || item.categoria || item.ciudad || 'Elemento listo para lectura.'" class="body" style="color: #37474f;" textWrap="true"></Label>
      </StackLayout>
    </StackLayout>

  </StackLayout>
</ScrollView>
